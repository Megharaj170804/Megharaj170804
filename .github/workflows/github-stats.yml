name: Update GitHub Profile Stats

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # Checkout profile repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Create profile directory
      - name: Create profile directory
        run: mkdir -p profile

      # Generate GitHub Stats
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Megharaj170804&show_icons=true&theme=tokyonight&hide_title=false&hide_rank=false&include_all_commits=true&count_private=true&line_height=23
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Generate Top Languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Megharaj170804&theme=tokyonight&layout=compact&langs_count=6&hide_progress=false&card_width=400
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Generate Streak Stats
      - name: Generate Streak Stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Megharaj170804&theme=tokyonight&hide_border=false&date_format=M+j%5B%2C+Y%5D&mode=daily&hide_total_contributions=false&hide_current_streak=false&hide_longest_streak=false&card_height=200&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Generate Trophies
      - name: Generate Trophies
        run: |
          TROPHY_URL="https://github-trophies.devomb.com/?username=Megharaj170804&theme=tokyonight&no-frame=false&no-bg=true&margin-w=4&rank=SSS,SS,S,AAA,AA,A,B,C"
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$TROPHY_URL" -o profile/trophies_temp.svg
          if grep -q "<svg" profile/trophies_temp.svg && ! grep -q "Just a moment" profile/trophies_temp.svg && ! grep -q "DEPLOYMENT_DISABLED" profile/trophies_temp.svg; then
            mv profile/trophies_temp.svg profile/trophies.svg
            echo "Successfully generated profile/trophies.svg"
          else
            echo "Warning: Trophies service returned invalid SVG or was challenged. Keeping existing trophies.svg"
            rm -f profile/trophies_temp.svg
          fi

      # Commit generated SVG files
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace "(last year)" with "(2026)" for current year accuracy
          # And fix SVG opacity bug and center rank letter so stats are always visible on GitHub
          if [ -f profile/stats.svg ]; then
            sed -i 's/(last year)/(2026)/g' profile/stats.svg
            sed -i 's/opacity: 0;/opacity: 1;/g' profile/stats.svg
            sed -i 's/animation: scaleInAnimation[^;]*;//g' profile/stats.svg
            sed -i 's/x="-5" y="3"/x="-10" y="8"/g' profile/stats.svg
          fi

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
