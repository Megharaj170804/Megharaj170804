name: Update GitHub Profile Stats

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # Checkout profile repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Create profile directory
      - name: Create profile directory
        run: mkdir -p profile

      # Generate GitHub Stats
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Megharaj170804&show_icons=true&theme=tokyonight&hide_title=false&hide_rank=false&include_all_commits=false&count_private=true&line_height=23
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Generate Top Languages
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Megharaj170804&theme=tokyonight&layout=compact&langs_count=6&hide_progress=false&card_width=400
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Generate Streak Stats
      - name: Generate Streak Stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Megharaj170804&theme=tokyonight&hide_border=false&date_format=M+j%5B%2C+Y%5D&mode=daily&hide_total_contributions=false&hide_current_streak=false&hide_longest_streak=false&card_height=200&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Commit generated SVG files
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Replace "(last year)" with "(2026)" for current year accuracy
          if [ -f profile/stats.svg ]; then
            sed -i 's/(last year)/(2026)/g' profile/stats.svg
          fi

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
